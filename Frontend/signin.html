<!DOCTYPE html>
<html lang="en">
<head>
<link rel=icon type=image/png href=assets/logo.png>
<link rel=apple-touch-icon href=assets/logo.png>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberScope | Sign In</title>
<style>
:root{--bg:#050a12;--panel:#0a1220;--panel2:#0d1727;--text:#eaf4ff;--muted:#8da1b8;--cyan:#36cfff;--blue:#388bff;--danger:#ff6b7a;--green:#5dffb1;--amber:#ffb84d}
*{box-sizing:border-box}html{scroll-behavior:smooth}:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--text);background:var(--bg);display:grid;place-items:center;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(54,207,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(54,207,255,.035) 1px,transparent 1px);background-size:42px 42px}
.topbar{position:fixed;top:0;left:0;right:0;height:74px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(54,207,255,.1);background:rgba(5,10,18,.88);backdrop-filter:blur(14px);z-index:5}.brand{display:flex;gap:11px;align-items:center;color:var(--text);text-decoration:none}.brand-mark{width:38px;height:38px;border:1px solid rgba(54,207,255,.55);border-radius:10px;display:grid;place-items:center;overflow:hidden;background:rgba(8,16,28,.8);box-shadow:0 0 15px rgba(54,207,255,.25);flex-shrink:0;transition:transform .2s ease,box-shadow .2s ease}.brand-mark img{width:100%;height:100%;object-fit:contain;display:block;padding:2px}.brand:hover .brand-mark{transform:scale(1.05);box-shadow:0 0 22px rgba(54,207,255,.5)}.brand strong{display:block;letter-spacing:2px;font-size:14px}.brand small{color:var(--muted);font-size:9px}.back{color:var(--muted);text-decoration:none;font-size:12px}.back:hover{color:var(--cyan)}
.card{width:min(440px,calc(100% - 36px));margin-top:45px;padding:34px;border:1px solid rgba(54,207,255,.14);border-radius:20px;background:linear-gradient(145deg,rgba(13,23,39,.96),rgba(8,16,28,.96));box-shadow:0 25px 80px rgba(0,0,0,.45);position:relative;animation:cardIn .45s cubic-bezier(.4,0,.2,1) both}@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:2px;font-weight:800}.card h1{margin:10px 0 8px;font-size:31px}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:24px}
label{display:block;color:#b9c8d9;font-size:11px;font-weight:700;margin:16px 0 7px}input{width:100%;height:46px;border:1px solid rgba(141,161,184,.18);border-radius:10px;background:#07111e;color:var(--text);padding:0 13px;outline:none;font-size:14px;transition:border-color .2s ease,box-shadow .2s ease}input:focus{border-color:rgba(54,207,255,.6);box-shadow:0 0 0 3px rgba(54,207,255,.07)}.password-wrap{position:relative}.password-wrap input{padding-right:65px}.show{position:absolute;right:10px;top:8px;height:30px;padding:0 9px;border:0;border-radius:7px;background:#0d1727;color:var(--muted);cursor:pointer;font-size:11px;transition:color .2s ease}.show:hover{color:var(--cyan)}.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 20px;font-size:12px;color:var(--muted)}.remember{display:flex;align-items:center;gap:7px}.remember input{width:14px;height:14px}.forgot{color:var(--cyan);text-decoration:none;transition:opacity .2s ease;cursor:pointer}.forgot:hover{opacity:.75}.btn{width:100%;height:46px;border:0;border-radius:10px;background:var(--cyan);color:#03101b;font-weight:900;cursor:pointer;font-size:14px;transition:filter .2s ease,transform .2s ease}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}.message{display:none;margin-top:15px;padding:11px 12px;border-radius:9px;font-size:12px;line-height:1.5;animation:cardIn .25s ease both}.message.show{display:block}.message.error{background:rgba(255,107,122,.08);border:1px solid rgba(255,107,122,.25);color:#ff9aa5}.message.success{background:rgba(93,255,177,.07);border:1px solid rgba(93,255,177,.2);color:var(--green)}.message a{color:var(--cyan);text-decoration:underline;font-weight:700;margin-left:4px;transition:color .2s ease}.message a:hover{color:#7fe0ff}.bottom{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}.bottom a{color:var(--cyan);text-decoration:none;font-weight:700;transition:color .2s ease}.bottom a:hover{color:#7fe0ff}

@media(max-width:560px){.topbar{padding:0 20px}.back{font-size:11px}.card{padding:27px 22px}.card h1{font-size:27px}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><div class="brand-mark"><img src="assets/logo.png" alt="CyberScope"></div><div><strong>CYBERSCOPE</strong><small>A Project of TetraByte</small></div></a><a class="back" href="index.html">← Back to CyberScope</a></header>
<main class="card">
<div class="eyebrow">SECURE ACCESS</div>
<h1>Welcome Back</h1>
<div class="sub">Sign in to open your CyberScope investigation workspace.</div>

<form id="signinForm" novalidate>
<label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
<label for="password">PASSWORD</label>
<div class="password-wrap">
  <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
  <button type="button" class="show" onclick="togglePassword()">Show</button>
</div>

<div class="row">
  <label class="remember"><input id="remember" type="checkbox"> Remember me</label>
  <a class="forgot" href="#" onclick="handleForgot(event)">Forgot password?</a>
</div>
<button class="btn" id="submitBtn" type="submit">Sign In →</button>
<div id="message" class="message"></div>
</form>

<div class="bottom">Don't have an account? <a href="register.html">Create Account</a></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
function togglePassword(){
  const input = document.getElementById('password');
  const button = document.querySelector('.show');
  const visible = input.type === 'text';
  input.type = visible ? 'password' : 'text';
  button.textContent = visible ? 'Show' : 'Hide';
}

function showMessage(htmlOrText, type){
  const box = document.getElementById('message');
  box.innerHTML = htmlOrText;
  box.className = 'message show ' + type;
}


async function handleForgot(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  if(!email){
    showMessage('Please enter your email address in the field above first, then click "Forgot password?".', 'error');
    return;
  }
  showMessage('Processing password reset request...', 'success');
  const res = await window.CyberScopeAuth.resetPassword(email);
  if(res.success){
    showMessage(res.message || 'Password reset instructions have been sent to your email.', 'success');
  } else {
    showMessage((res.error && res.error.message) || 'Password recovery could not be initiated.', 'error');
  }
}

// 1. Read URL search parameters on load: if ?email=... is present, pre-fill #email and focus #password
function initFromParams(){
  try {
    const params = new URLSearchParams(window.location.search);
    const emailParam = params.get('email');
    if (emailParam) {
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      if (emailInput) {
        emailInput.value = emailParam.trim();
      }
      if (passwordInput) {
        setTimeout(function(){ passwordInput.focus(); }, 60);
      }
    }
  } catch (e) {}
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initFromParams);
} else {
  initFromParams();
}

function sanitizeRedirect(target) {
  if (!target || typeof target !== 'string') return 'dashboard.html';
  var clean = target.trim().split('?')[0].split('#')[0].split('/').pop();
  var allowed = [
    'dashboard.html', 'cases.html', 'new-case.html', 'fraud-graph.html',
    'threat-map.html', 'entity-explorer.html', 'transaction-explorer.html',
    'campaign-explorer.html', 'investigation-workspace.html', 'chatbot.html',
    'index.html'
  ];
  if (/^[a-z0-9-]+\.html$/.test(clean) && allowed.indexOf(clean) !== -1) {
    return clean;
  }
  return 'dashboard.html';
}

// 2. Form submit handling coordinating with POST /api/auth/login and fallback to window.CyberScopeAuth.signIn
document.getElementById('signinForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const email = (emailInput.value || '').trim().toLowerCase();
  const password = passwordInput.value || '';
  const submitBtn = document.getElementById('submitBtn');

  if(!email || !password){
    showMessage('Please enter your email and password.', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Authenticating...';

  const params = new URLSearchParams(window.location.search);
  const redirect = sanitizeRedirect(params.get('redirect'));

  const endpoint = (window.location.protocol === 'file:') ? 'http://127.0.0.1:8000/api/auth/login' : '/api/auth/login';

  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password })
    });

    if (response.status === 200) {
      const data = await response.json();
      if (data && data.user) {
        localStorage.setItem('cyberscopeUser', JSON.stringify(data.user));
      }
      localStorage.setItem('cyberscopeSession', 'active');
      if (data && data.access_token) {
        localStorage.setItem('cyberscopeAccessToken', data.access_token);
      }
      showMessage('Sign in successful. Opening your workspace...', 'success');
      setTimeout(function() {
        window.location.href = redirect;
      }, 500);
      return;
    } else {
      const errData = await response.json().catch(function() { return {}; });
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In →';
      showMessage(errData.detail || errData.message || 'Invalid email or password.', 'error');
      return;
    }
  } catch (netErr) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In →';
    showMessage('Authentication server is unreachable. Please check your connection.', 'error');
  }
});
</script>
</body>
</html>
